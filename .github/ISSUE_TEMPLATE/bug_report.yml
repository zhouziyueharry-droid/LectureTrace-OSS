name: Bug report
description: Report a reproducible problem / 报告问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use synthetic examples. Do not attach keys, private course files or personal data. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, commit/version, Python/Node versions and enabled extras.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, personal paths and private course content.
