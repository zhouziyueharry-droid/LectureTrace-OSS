[project]
name = "lecturetrace-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "anthropic>=0.60",
  "deepl>=1.18",
  "opencv-python-headless>=4.10",
  "imagehash>=4.3",
  "pillow>=13.0.0",
  "numpy>=1.26",
  "scikit-image>=0.24",
  "sse-starlette>=2.1",
  "openai>=3.19.2",
  "tiktoken>=0.14.0",
  "pypdf>=6.21.4,<7",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
asr = ["faster-whisper>=1.1"]
cuda = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.26.0.51; sys_platform == 'win32' or sys_platform == 'linux'",
]
pdf-ocr = [
    "docling>=2,<3",
    "onnxruntime>=1.20",
    "rapidocr>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
